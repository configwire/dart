name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: browser-actions/setup-chrome@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      - run: dart test -p chrome test/chrome_smoke_test.dart
