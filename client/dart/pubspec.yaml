name: config_nest
description: Pure-Dart ConfigNest client (fetch, cache, typed getters, realtime). Scaffold for todos 12/14.
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  http: ^1.2.0 # pure-Dart; shared_preferences deliberately omitted (Flutter-only, would violate pure-Dart rule) — todo 12 picks a pure-Dart cache
  crypto: ^3.0.0 # pure-Dart SHA-256 for userHash (sha256hex16); no Flutter, no native
  meta: ^1.12.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
